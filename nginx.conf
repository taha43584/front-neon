# Site Angular. /api, /media et /manus-storage n'arrivent pas ici : Traefik (Dokploy) les envoie au back.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;

  # Fichiers avec empreinte dans le nom (main-HASH.js…) : gardés un an
  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri @index;
  }

  # Fichiers sans empreinte : revalidés à chaque visite (BACK-A-FAIRE n° 25)
  location = /index.html {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
  }
  location = /theme-sombre.css {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
  }

  # Toute autre adresse (/produit/…, /admin…) affiche l'application
  location @index {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }
}
